[project]
name = "dispatchkit-core-mcp"
version = "0.1.0"
description = "DispatchKit Core MCP server. Sample for AI workshop Module 5 (PR review)."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.scripts]
dispatchkit-core-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
